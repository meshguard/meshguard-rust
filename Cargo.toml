[package]
name = "meshguard"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for the MeshGuard governance gateway"
license = "MIT"
repository = "https://github.com/meshguard/meshguard-rust"
keywords = ["meshguard", "governance", "ai", "policy", "security"]
categories = ["api-bindings", "authentication"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
